<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="title description">
  <title id="title">Performance signoff: multi-agent workflow</title>
  <desc id="description">A request and source evidence pass to a router, then four parallel performance specialists. Critique validates and may request refinement. A validated report goes to a human decision maker and an audit trail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#497268"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #293b35; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; fill: #5f6f67; }
      .box { fill: #f4f7f3; stroke: #99b3a6; stroke-width: 1.5; rx: 10; }
      .line { fill: none; stroke: #497268; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="700" fill="#fff"/>
  <text x="54" y="49" font-size="22" font-weight="600">Performance signoff</text>
  <text x="54" y="75" class="small">Multi-agent orchestration with an explicit human decision boundary</text>
  <rect class="box" x="285" y="101" width="510" height="60"/>
  <text x="540" y="126" text-anchor="middle" class="label">Request + authoritative source evidence</text>
  <text x="540" y="148" text-anchor="middle" class="small">Case context, performance measurements, traces</text>
  <path class="line" d="M540 161V185"/>
  <rect class="box" x="285" y="187" width="510" height="69"/>
  <text x="540" y="213" text-anchor="middle" class="label">Router + evidence normalization</text>
  <text x="540" y="237" text-anchor="middle" class="small">Validate context; select specialists; preserve one evidence revision</text>
  <path d="M540 256V280H160V303M540 280H414V303M540 280H668V303M540 280H920V303" fill="none" stroke="#497268" stroke-width="2"/>
  <rect class="box" x="54" y="303" width="212" height="98"/>
  <rect class="box" x="308" y="303" width="212" height="98"/>
  <rect class="box" x="562" y="303" width="212" height="98"/>
  <rect class="box" x="816" y="303" width="212" height="98"/>
  <text x="160" y="332" text-anchor="middle" class="label">HTML specialist</text>
  <text x="160" y="358" text-anchor="middle" class="small">Component contributions</text>
  <text x="160" y="379" text-anchor="middle" class="small">Consistency evidence</text>
  <text x="414" y="332" text-anchor="middle" class="label">Page-load specialist</text>
  <text x="414" y="358" text-anchor="middle" class="small">Baseline / treatment</text>
  <text x="414" y="379" text-anchor="middle" class="small">Waterfall and latency</text>
  <text x="668" y="332" text-anchor="middle" class="label">Paint specialists</text>
  <text x="668" y="358" text-anchor="middle" class="small">Rendering critical path</text>
  <text x="668" y="379" text-anchor="middle" class="small">Paint-impact attribution</text>
  <text x="922" y="332" text-anchor="middle" class="label">Server specialists</text>
  <text x="922" y="358" text-anchor="middle" class="small">Server contributions</text>
  <text x="922" y="379" text-anchor="middle" class="small">Trace correlation</text>
  <path d="M160 401V422H920V401M414 401V422M668 401V422" fill="none" stroke="#497268" stroke-width="2"/>
  <path class="line" d="M540 422V455"/>
  <text x="540" y="445" text-anchor="middle" class="small">Parallel fan-out / fan-in; separate structured results</text>
  <rect class="box" x="210" y="459" width="660" height="78"/>
  <text x="540" y="486" text-anchor="middle" class="label">Critique: synthesize + validate</text>
  <text x="540" y="509" text-anchor="middle" class="small">Evidence support, coverage, numeric integrity, bounded refinement</text>
  <text x="540" y="528" text-anchor="middle" class="small">Publish validated report, revise, or escalate for review</text>
  <path class="line" d="M540 537V562H193V580"/>
  <rect class="box" x="54" y="584" width="280" height="62"/>
  <rect class="box" x="399" y="584" width="280" height="62"/>
  <rect class="box" x="744" y="584" width="280" height="62"/>
  <path class="line" d="M334 615H397"/>
  <path class="line" d="M679 615H742"/>
  <text x="194" y="609" text-anchor="middle" class="label">Controlled publication</text>
  <text x="194" y="632" text-anchor="middle" class="small">Workspace + verified email thread</text>
  <text x="539" y="609" text-anchor="middle" class="label">Human decision</text>
  <text x="539" y="632" text-anchor="middle" class="small">Review evidence; retain authority</text>
  <text x="884" y="609" text-anchor="middle" class="label">Action + audit trail</text>
  <text x="884" y="632" text-anchor="middle" class="small">Decision, report and evidence versions</text>
  <path class="line" d="M1024 615H1044V223H797" stroke-dasharray="5 5"/>
  <text x="1059" y="457" transform="rotate(-90 1059 457)" text-anchor="middle" class="small">New evidence / review feedback</text>
  <text x="540" y="680" text-anchor="middle" class="small">An agent validates the report; it does not independently approve shipment.</text>
</svg>
